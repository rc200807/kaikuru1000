<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" fill="none">
  <!-- 背景 -->
  <rect width="560" height="310" rx="8" fill="#FDE8E8"/>
  <!-- 伝票本体 -->
  <rect x="40" y="20" width="480" height="270" rx="4" fill="#FECACA" stroke="#E53E3E" stroke-width="1.5"/>
  <!-- 上段: お届け先 -->
  <rect x="55" y="35" width="460" height="120" rx="3" fill="white" stroke="#E53E3E" stroke-width="1"/>
  <!-- 郵便番号欄 -->
  <rect x="65" y="42" width="180" height="24" rx="2" fill="white" stroke="#E53E3E" stroke-width="0.8"/>
  <text x="70" y="58" font-family="sans-serif" font-size="10" fill="#E53E3E">〒</text>
  <!-- 郵便番号のマス目 -->
  <rect x="85" y="44" width="16" height="18" rx="1" fill="white" stroke="#E53E3E" stroke-width="0.5"/>
  <rect x="103" y="44" width="16" height="18" rx="1" fill="white" stroke="#E53E3E" stroke-width="0.5"/>
  <rect x="121" y="44" width="16" height="18" rx="1" fill="white" stroke="#E53E3E" stroke-width="0.5"/>
  <text x="142" y="58" font-family="sans-serif" font-size="11" fill="#E53E3E">-</text>
  <rect x="150" y="44" width="16" height="18" rx="1" fill="white" stroke="#E53E3E" stroke-width="0.5"/>
  <rect x="168" y="44" width="16" height="18" rx="1" fill="white" stroke="#E53E3E" stroke-width="0.5"/>
  <rect x="186" y="44" width="16" height="18" rx="1" fill="white" stroke="#E53E3E" stroke-width="0.5"/>
  <rect x="204" y="44" width="16" height="18" rx="1" fill="white" stroke="#E53E3E" stroke-width="0.5"/>
  <!-- 住所欄の線 -->
  <line x1="65" y1="80" x2="300" y2="80" stroke="#E53E3E" stroke-width="0.5"/>
  <line x1="65" y1="100" x2="300" y2="100" stroke="#E53E3E" stroke-width="0.5"/>
  <line x1="65" y1="120" x2="300" y2="120" stroke="#E53E3E" stroke-width="0.5"/>
  <!-- お届け先ラベル -->
  <text x="68" y="75" font-family="sans-serif" font-size="8" fill="#999">お届け先</text>
  <!-- 品名欄 -->
  <rect x="310" y="42" width="200" height="108" rx="2" fill="white" stroke="#E53E3E" stroke-width="0.8"/>
  <text x="315" y="55" font-family="sans-serif" font-size="8" fill="#999">品名</text>
  <!-- 記入例テキスト -->
  <text x="340" y="88" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">衣類など</text>
  <text x="340" y="118" font-family="monospace" font-size="16" font-weight="bold" fill="#B91C1C">HD-202604-1234</text>
  <!-- ご依頼主 -->
  <rect x="55" y="165" width="300" height="110" rx="3" fill="white" stroke="#E53E3E" stroke-width="1"/>
  <text x="68" y="182" font-family="sans-serif" font-size="8" fill="#999">ご依頼主</text>
  <line x1="65" y1="195" x2="340" y2="195" stroke="#E53E3E" stroke-width="0.5"/>
  <line x1="65" y1="215" x2="340" y2="215" stroke="#E53E3E" stroke-width="0.5"/>
  <line x1="65" y1="235" x2="340" y2="235" stroke="#E53E3E" stroke-width="0.5"/>
  <line x1="65" y1="255" x2="340" y2="255" stroke="#E53E3E" stroke-width="0.5"/>
  <!-- 切手欄 -->
  <rect x="390" y="195" width="60" height="50" rx="2" fill="white" stroke="#E53E3E" stroke-width="0.8"/>
  <!-- 矢印と注釈 -->
  <line x1="410" y1="142" x2="410" y2="125" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
  </defs>
  <text x="370" y="155" font-family="sans-serif" font-size="9" font-weight="bold" fill="#B91C1C">品名欄に記入!</text>
</svg>
